name: The Organism

# Free-tier tuning:
# - schedule every 4 hours (6 wakes/day). With the 15-minute job timeout the
#   worst case is ~90 Actions minutes/day — comfortably inside the 2,000
#   min/month free tier for private repos (unlimited on public repos).
# - the issues trigger fires only on `opened` so the organism's own comments
#   and edits can never re-trigger it (the old issue_comment trigger created
#   an infinite loop: reply -> event -> wake -> reply ...).
on:
  schedule:
    - cron: "17 */4 * * *"
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: organism
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never wake for events generated by bots (incl. github-actions itself).
    if: github.event_name != 'issues' || github.event.issue.user.type != 'Bot'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Configure Git identity
        run: |
          git config user.name "The Organism"
          git config user.email "organism@localhost"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # gnupg ships preinstalled on ubuntu-latest; verify instead of
      # spending ~30s of billable time on apt-get every run.
      - name: Verify PGP engine
        run: gpg --version | head -1

      - name: Wake up
        id: wake
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          ORGANISM_PRIVATE_KEY: ${{ secrets.ORGANISM_PRIVATE_KEY }}
          FOUNDER_PUBLIC_KEY: ${{ secrets.FOUNDER_PUBLIC_KEY }}
          FOUNDER_GITHUB_USERNAME: ${{ secrets.FOUNDER_GITHUB_USERNAME }}
          KILL_PHRASE: ${{ secrets.KILL_PHRASE }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ORGANISM_WALLET_KEY: ${{ secrets.ORGANISM_WALLET_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          # The organism's entire collected key inventory. Any secret the
          # founder adds (at the organism's request) becomes usable on the
          # very next wake — no workflow edit needed. The model router
          # (integrations/model_router.py) resolves provider keys from here
          # by env-var name. GitHub still masks every value in the logs.
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: python main.py

      - name: Commit memory and reports
        if: always()
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "organism: persist memory and reports [$(date -u +%Y-%m-%dT%H:%M:%SZ)]" \
              --author "The Organism <organism@localhost>"
            # Another run (or the founder) may have pushed meanwhile:
            # rebase instead of failing, then push with bounded retries.
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" || true
              if git push origin HEAD:"${GITHUB_REF_NAME}"; then
                break
              fi
              echo "Push attempt $i failed; retrying..."
              sleep 5
            done
          fi

      - name: Notify failure via issue
        if: failure() && github.event_name != 'issues'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          # De-duplicate: only open a failure issue when none is already open.
          existing=$(gh issue list --state open --search "[organism] wake cycle failed in:title" --json number --jq 'length' || echo 0)
          if [ "${existing:-0}" = "0" ]; then
            gh issue create \
              --title "[organism] wake cycle failed" \
              --body "The wake cycle failed. Check the Actions logs for details. — The Organism" \
              --label "founder" || true
          else
            echo "Failure issue already open; not duplicating."
          fi
